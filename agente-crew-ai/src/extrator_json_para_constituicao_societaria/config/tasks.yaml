---
extracao_de_dados_para_constituicao_societaria:
  description: 'Conduzir uma conversa natural e fluida com o usuário para coletar
    todas as informações necessárias para constituição de uma sociedade empresarial.
    O agente deve preencher progressivamente um JSON estruturado com 8 seções principais:
    1) Informações Pessoais dos Sócios, 2) Estrutura da Sociedade, 3) Governança e
    Administração, 4) Distribuição de Lucros, 5) Cláusulas de Proteção e Saída, 6)
    Conflitos e Solução de Controvérsias, 7) Aspectos Estratégicos, e 8) Investimentos
    e Financiamentos. Fazer perguntas contextuais, explicar quando necessário os termos
    jurídicos, e garantir que todas as informações obrigatórias sejam coletadas de
    forma conversacional e amigável.'
  expected_output: Um JSON completo e estruturado contendo todas as informações coletadas
    organizadas nas 8 seções, com todos os campos preenchidos baseados na conversa
    natural com o usuário. Além disso, gerar um arquivo em formato markdown (.md)
    apresentando de forma organizada e legível todas as chaves e valores coletados,
    com formatação clara e seções bem definidas. O markdown deve servir como um resumo
    executivo das informações da constituição societária.
  agent: extrator_conversacional_de_dados_json
