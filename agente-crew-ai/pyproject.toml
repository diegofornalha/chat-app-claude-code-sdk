[project]
name = "extrator_json_para_constituicao_societaria"
version = "0.1.0"
description = "extrator_json_para_constituicao_societaria using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.150.0,<1.0.0"
]

[project.scripts]
extrator_json_para_constituicao_societaria = "extrator_json_para_constituicao_societaria.main:run"
run_crew = "extrator_json_para_constituicao_societaria.main:run"
train = "extrator_json_para_constituicao_societaria.main:train"
replay = "extrator_json_para_constituicao_societaria.main:replay"
test = "extrator_json_para_constituicao_societaria.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
